name: Change review

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: change-review-${{ github.ref }}
  cancel-in-progress: true

env:
  MODULE_DIR: flutterwavepayment

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PrestaShop 1.7 through 9 runtimes
        php: ['7.2', '7.4', '8.1', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint module PHP files
        run: |
          set -e
          find "$MODULE_DIR" -name '*.php' -print0 | xargs -0 -n1 php -l

  module-checks:
    name: Module structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Every directory has an index.php
        run: |
          missing=$(find "$MODULE_DIR" -type d | while read -r d; do [ -f "$d/index.php" ] || echo "$d"; done)
          if [ -n "$missing" ]; then
            echo "::error::Directories without index.php:"
            echo "$missing"
            exit 1
          fi

      - name: Every PHP file guards against direct access
        run: |
          missing=$(find "$MODULE_DIR" -name '*.php' ! -name index.php | while read -r f; do grep -q "_PS_VERSION_" "$f" || echo "$f"; done)
          if [ -n "$missing" ]; then
            echo "::error::PHP files without an _PS_VERSION_ guard:"
            echo "$missing"
            exit 1
          fi

      - name: Module and config.xml versions match
        id: version
        run: |
          php_version=$(sed -n "s/.*\$this->version = '\([^']*\)'.*/\1/p" "$MODULE_DIR/$MODULE_DIR.php")
          xml_version=$(sed -n 's/.*<version><!\[CDATA\[\([^]]*\)\]\]><\/version>.*/\1/p' "$MODULE_DIR/config.xml")
          echo "Module: $php_version, config.xml: $xml_version"
          if [ -z "$php_version" ] || [ "$php_version" != "$xml_version" ]; then
            echo "::error::Version in $MODULE_DIR.php ($php_version) does not match config.xml ($xml_version)"
            exit 1
          fi
          echo "current=$php_version" >> "$GITHUB_OUTPUT"

      - name: Version bumps ship an upgrade script
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          base=$(git show "$BASE_SHA:$MODULE_DIR/$MODULE_DIR.php" 2>/dev/null | sed -n "s/.*\$this->version = '\([^']*\)'.*/\1/p")
          echo "Base: ${base:-none}, head: $CURRENT"
          if [ -n "$base" ] && [ "$base" != "$CURRENT" ] && [ ! -f "$MODULE_DIR/upgrade/upgrade-$CURRENT.php" ]; then
            echo "::warning::Version changed from $base to $CURRENT without $MODULE_DIR/upgrade/upgrade-$CURRENT.php. Add one if the database or hooks changed."
          fi

      - name: Database schema changes ship an upgrade script
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          schema_changed=$(git diff "$BASE_SHA"...HEAD -- "$MODULE_DIR/$MODULE_DIR.php" | grep -E '^[+-].*(CREATE TABLE|KEY `|` (INT|VARCHAR|DECIMAL|TINYINT|DATETIME))' || true)
          upgrade_added=$(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD -- "$MODULE_DIR/upgrade/" || true)
          if [ -n "$schema_changed" ] && [ -z "$upgrade_added" ]; then
            echo "::error::The install schema changed but no upgrade script was added, so existing shops will not get the change:"
            echo "$schema_changed"
            exit 1
          fi

  package:
    name: Build module zip
    runs-on: ubuntu-latest
    needs: [php-lint, module-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create module zip
        run: |
          set -e
          mkdir -p dist/package-root
          cp -R "$MODULE_DIR" "dist/package-root/$MODULE_DIR"
          cd dist/package-root
          zip -r "../$MODULE_DIR.zip" "$MODULE_DIR"
          cd ..
          unzip -l "$MODULE_DIR.zip" | grep -q "$MODULE_DIR/$MODULE_DIR.php"
          ls -lh "$MODULE_DIR.zip"

      - name: Upload zip for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODULE_DIR }}-${{ github.sha }}
          path: dist/${{ env.MODULE_DIR }}.zip
          retention-days: 14
