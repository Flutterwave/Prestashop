name: Build and attach module release zip

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-module:
    runs-on: ubuntu-latest

    env:
      MODULE_DIR: flutterwavepayment
      PACKAGE_NAME: flutterwavepayment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release zip
        run: |
          set -e
          mkdir -p dist/package-root
          cp -R "$MODULE_DIR" "dist/package-root/$MODULE_DIR"
          cd dist/package-root
          zip -r "../${PACKAGE_NAME}.zip" "$MODULE_DIR"
          cd ..
          ls -lh "${PACKAGE_NAME}.zip"

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-zip
          path: dist/${{ env.PACKAGE_NAME }}.zip

      - name: Upload zip to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.PACKAGE_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
